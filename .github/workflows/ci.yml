name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract (with German + English data)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $dir = "C:\Program Files\Tesseract-OCR"
          foreach ($lang in @("deu", "eng", "osd")) {
            $f = Join-Path $dir "tessdata\$lang.traineddata"
            if (-not (Test-Path $f)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $f
            }
          }
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\tesseract.exe" --list-langs

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check supplier_app tests scripts

      - name: Tests with coverage thresholds
        run: >
          python -m pytest tests --cov=supplier_app --cov-report=term-missing --cov-report=xml
          --cov-fail-under=85

      - name: Coverage per area (ledger >= 90 %, repositories/migrations/services/ai >= 80 %)
        run: python scripts/check_coverage.py coverage.xml

      - name: Self-check (database, migrations, every screen offscreen)
        run: python -m supplier_app --selfcheck

      - name: Screenshots of every screen (dark + light, demo data)
        run: python -m supplier_app --screenshots artifacts/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: error

      - name: Build the self-contained package
        shell: pwsh
        run: scripts/build_exe.ps1

      - name: Self-check of the built executable
        shell: pwsh
        run: |
          $env:SUPPLIERAPP_DATA = Join-Path $env:RUNNER_TEMP "exe-selfcheck"
          $p = Start-Process -FilePath "dist\SupplierApp\SupplierAppConsole.exe" -ArgumentList "--selfcheck" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe selfcheck failed with exit code $($p.ExitCode)" }
          $t = Get-Item "dist\SupplierApp\tesseract\tesseract.exe"
          & $t.FullName --list-langs
          $p2 = Start-Process -FilePath "dist\SupplierApp\SupplierApp.exe" -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "windowed exe selfcheck failed with exit code $($p2.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SupplierApp-windows-x64
          path: dist/SupplierApp-windows-x64.zip
          if-no-files-found: error
