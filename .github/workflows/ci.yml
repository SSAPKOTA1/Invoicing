name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Tesseract (with German + English data)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $dir = "C:\Program Files\Tesseract-OCR"
          foreach ($lang in @("deu", "eng", "osd")) {
            $f = Join-Path $dir "tessdata\$lang.traineddata"
            if (-not (Test-Path $f)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $f
            }
          }
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$dir\tesseract.exe" --list-langs

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: PostgreSQL server (the program works only with PostgreSQL)
        shell: pwsh
        run: scripts/ci_postgres_windows.ps1

      - name: Lint
        run: ruff check supplier_app tests scripts

      - name: Tests
        timeout-minutes: 25
        run: python -m pytest tests -v --durations=15 -o faulthandler_timeout=300

      - name: Self-check (database, migrations, every screen offscreen)
        run: python -m supplier_app --selfcheck

      - name: Screenshots of every screen (dark + light, demo data)
        run: python -m supplier_app --screenshots artifacts/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: artifacts/screenshots
          if-no-files-found: error

      - name: Build the self-contained package
        shell: pwsh
        run: scripts/build_exe.ps1

      - name: Self-check of the built executable
        shell: pwsh
        run: |
          $env:SUPPLIERAPP_DATA = Join-Path $env:RUNNER_TEMP "exe-selfcheck"
          $p = Start-Process -FilePath "dist\SupplierApp\SupplierAppConsole.exe" -ArgumentList "--selfcheck" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe selfcheck failed with exit code $($p.ExitCode)" }
          $t = Get-Item "dist\SupplierApp\tesseract\tesseract.exe"
          & $t.FullName --list-langs
          $p2 = Start-Process -FilePath "dist\SupplierApp\SupplierApp.exe" -ArgumentList "--selfcheck" -Wait -PassThru
          if ($p2.ExitCode -ne 0) { throw "windowed exe selfcheck failed with exit code $($p2.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: SupplierApp-windows-x64
          path: dist/SupplierApp-windows-x64.zip
          if-no-files-found: error

  postgres:
    # The same tests on Linux with a PostgreSQL service container, plus the coverage thresholds.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QT_QPA_PLATFORM: offscreen
      SUPPLIER_TEST_PG_DSN: host=localhost port=5432 user=postgres password=ci dbname=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: System packages (Qt offscreen, Tesseract with German data)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests with coverage
        timeout-minutes: 30
        run: >
          python -m pytest tests -v --durations=15 -o faulthandler_timeout=300 --cov=supplier_app
          --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Coverage per area (ledger >= 90 %, repositories/database/services/ai >= 80 %)
        run: python scripts/check_coverage.py coverage.xml
