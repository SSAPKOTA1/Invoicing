name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Tesseract (with German + English data)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $dir = "C:\Program Files\Tesseract-OCR"
          foreach ($lang in @("deu", "eng", "osd")) {
            $f = Join-Path $dir "tessdata\$lang.traineddata"
            if (-not (Test-Path $f)) {
              Invoke-WebRequest -Uri "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$lang.traineddata" -OutFile $f
            }
          }
          echo $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests --cov=supplier_app --cov-fail-under=85
      - run: python -m supplier_app --selfcheck
      - name: Build the package
        shell: pwsh
        run: scripts/build_exe.ps1
      - name: Self-check of the built executable
        shell: pwsh
        run: |
          $env:SUPPLIERAPP_DATA = Join-Path $env:RUNNER_TEMP "exe-selfcheck"
          $p = Start-Process -FilePath "dist\SupplierApp\SupplierAppConsole.exe" -ArgumentList "--selfcheck" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "exe selfcheck failed" }
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SupplierApp-windows-x64.zip
          generate_release_notes: true
