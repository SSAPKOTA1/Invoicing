[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["supplier_app"]
omit = ["supplier_app/__main__.py", "supplier_app/views/*", "supplier_app/controllers/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP042", "E501", "B008", "UP007", "UP045", "B905"]
